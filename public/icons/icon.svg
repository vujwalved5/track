<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Desk background (L6 #211b16) -->
  <rect width="512" height="512" rx="104" fill="#211b16" />
  
  <!-- Subtle desk shadow -->
  <rect x="76" y="56" width="360" height="400" rx="16" fill="#1c2433" opacity="0.4" />
  
  <!-- Oxblood hardcover book (#702028) with gold border (#d8b45a) -->
  <rect x="80" y="60" width="344" height="392" rx="14" fill="#702028" stroke="#d8b45a" stroke-width="4" />
  
  <!-- Darker spine band on left (#54181e) -->
  <path d="M 80 74 C 80 66, 86 60, 94 60 L 140 60 L 140 452 L 94 452 C 86 452, 80 446, 80 438 Z" fill="#54181e" />
  <line x1="140" y1="60" x2="140" y2="452" stroke="#d8b45a" stroke-width="3" stroke-dasharray="6 4" />
  
  <!-- Page edges visible on right edge (#f4eddc) -->
  <rect x="424" y="76" width="12" height="360" rx="3" fill="#f4eddc" stroke="#211b16" stroke-width="1.5" />
  
  <!-- Gold foil double inset border on front cover -->
  <rect x="156" y="80" width="252" height="352" rx="6" fill="none" stroke="#d8b45a" stroke-width="3.5" />
  <rect x="166" y="90" width="232" height="332" rx="4" fill="none" stroke="#d8b45a" stroke-width="1.5" stroke-dasharray="8 4" />
  
  <!-- Center gold monogram "M" -->
  <circle cx="282" cy="256" r="44" fill="none" stroke="#d8b45a" stroke-width="2.5" />
  <path d="M 264 270 L 274 242 L 282 258 L 290 242 L 300 270" fill="none" stroke="#d8b45a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Hanging redpen ribbon bookmark at bottom (#b3261e) -->
  <path d="M 240 452 L 260 452 L 260 492 L 250 482 L 240 492 Z" fill="#b3261e" stroke="#211b16" stroke-width="1" />
</svg>
